name: Build QuickClick Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TAG VERSION (contoh: 1.0.0 atau v1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: 'BUILD NUMBER (2 digit, contoh: 01)'
        required: true
        default: '01'
        type: string
      notes:
        description: 'CHANGELOG'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish otomatis ke tab Releases?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 belum diisi!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release.jks

      - name: Build Signed Release APK
        env:
          BASE_VERSION: ${{ inputs.version }}
          BUILD_NUM: ${{ inputs.build_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          DATE_SHORT=$(TZ="Asia/Jakarta" date +"%y%m%d")
          export APP_VERSION_NAME="${BASE_VERSION#v}"
          export APP_VERSION_CODE="${DATE_SHORT}${BUILD_NUM}"
          echo "Building versionName=${APP_VERSION_NAME} | versionCode=${APP_VERSION_CODE}"
          gradle clean assembleRelease --stacktrace

      - name: Clean up Release Keystore
        if: always()
        run: rm -f app/release.jks

      - name: Prepare & Verify Signed APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          CLEAN_VER="${VERSION#v}"
          OUT_APK="QuickClick-v${CLEAN_VER}.apk"

          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v "unsigned" | head -n 1 || true)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: Signed release APK tidak ditemukan. Pastikan signingConfigs sudah aktif di build.gradle.kts."
            exit 1
          fi

          cp "$APK_SRC" "$OUT_APK"

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs "$OUT_APK"

          echo "=== APK SIZE ==="
          ls -lh "$OUT_APK"
          echo "=== TOP 10 LARGEST FILES IN APK ==="
          unzip -l "$OUT_APK" | sort -k1 -n -r | head -n 12

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: QuickClick-${{ inputs.version }}
          path: QuickClick-v*.apk

      - name: Publish to GitHub Releases
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          CLEAN_VER="${VERSION#v}"
          TAG_NAME="v${CLEAN_VER}"
          APK_FILE="QuickClick-v${CLEAN_VER}.apk"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG_NAME" --title "QuickClick $TAG_NAME" --notes "$NOTES"
            fi
          else
            gh release create "$TAG_NAME" "$APK_FILE" \
              --title "QuickClick $TAG_NAME" \
              --notes "$NOTES" \
              --latest
          fi
          
